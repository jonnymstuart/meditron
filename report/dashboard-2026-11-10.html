' 1 to 28, 'ecografo samsung prezzo' 1 to 9, and the three used-machine terms dropped out of the top 50, with Art Medical Suisse holding all three top spots in French. AI answers: named in 19 of 60, cited in 26 (from 20), named first on 10 prompts (from 7). Nine articles live.", "next": ["Bind product and hub page titles and meta descriptions to the CMS meta fields (audit item 1).", "Redirect legacy.meditron.ch to www.meditron.ch (Meditron hosting).", "Hub: add a Guides section linking the nine articles; fix alt text on card images; fix the two listing-page headings.", "Production publish of the DE/FR/IT update, then reviewer sign-off per language on the live pages (Henri or Nikita for German, a Romandie colleague for French, a Ticino colleague for Italian).", "Italian URLs for articles 1 to 6. Report the sitemap bug to Framer.", "Weekly measurement every Monday; add Search Console clicks once access is granted."], "discuss": [{"topic": "legacy.meditron.ch", "why": "The old site is still online and indexed. Who controls its hosting and DNS, so it can redirect to www.meditron.ch?"}, {"topic": "Page headlines (H1s)", "why": "Hub and model pages now lead with 'Samsung Ultraschall'. Home and About still use brand lines. Should the home headline say what Meditron is?"}, {"topic": "About page text animation", "why": "The 'Our why' text animates letter by letter, which scrambles it for translation tools, screen readers and AI. Keep it, or switch to plain text?"}, {"topic": "Samsung's partner listing and SMD Medical", "why": "Samsung Healthcare's site has a 'Global Network' map, not a crawlable partner list, so a link from it is unlikely. SMD Medical is now also a Samsung partner in Switzerland. What is Meditron's agreement with Samsung, and can 'official distributor since 2012' be backed by a Samsung statement?"}, {"topic": "Google Business Profiles", "why": "Rolle and Frauenfeld profiles feed map results and AI answers. Who owns the Google account?"}, {"topic": "Legacy ne he live Z20 title is the template default and its meta description is 998 characters long.", "No click or impression data yet: Search Console access is still outstanding."], "opportunities": ["'ultraschallgerät' (590 a month) and 'ultraschall' (1,900): SMD Medical ranks 17th and 4th with one page. The German hub needs those words in its title and heading; it goes through Jean's review.", "The hub links to no articles. A Guides section passes the hub's authority to the nine pieces AI engines quote.", "Mobile speed: the hub's main image takes 8.8 seconds on a phone and the site loads 91 font files. Fixing fonts and hero images lifts every page.", "A 'which Samsung system for a Swiss practice' guide per language: MHZ is still named first in French and Italian for that question."], "risks": ["SMD Medical holds a top-3 spot on 5 of 20 tracked searches and ranks 1st for 'samsung ultraschall' and 'samsung hera z20' in German; Meditron is 2nd and 4th.", "Art Medical Suisse now owns the used-machine and generic 'ultrasound machine switzerland' results in French and English.", "Week-to-week swings of this size (Italian 1 to 28) mean one reading is not a trend; the Monday series is what counts.", "Google's result format changed in late October; the measurement now reads the site from the breadcrumb, which keeps the series comparable but is a reminder that SERP tooling needs checking each month."]}, "focus": ["Audit items 1, 4, 8, 10 this week: titles and meta fields, hub Guides section, alt text, listing headings. One Framer branch, half a day.", "Get the legacy.meditron.ch redirect done by Meditron's hosting contact.", "Framer auto-translate off for German and French, then publish main again; request indexing for the 12 priority URLs and resubmit the sitemap.", "Check Framer's auto-translate setting for French: it rewrote the French locale with machine text 15 seconds after the German push.", "Report the sitemap bug to Framer; set the Italian URLs for articles 1 to 6."], "tie   const path = have.map((p, j) => `${j ? "L" : "M"}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const last = have[have.length - 1];
  const fpts = pts.filter(p => p.f != null && p.i > last.i);
  const fpath = fpts.length ? `M${x(last.i).toFixed(1)},${y(last.v).toFixed(1)} ` + fpts.map(p => `L${x(p.i).toFixed(1)},${y(p.f).toFixed(1)}`).join(" ") : "";
  const grid = [0, 0.5, 1].map(f => { const v = min + (max - min) * f; return `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 10) / 10}</text>`; }).join("");
  const labels = pts.map(p => `<text class="ax ${p.m ? "" : "future"}" x="${x(p.i)}" y="${H - 8}" text-anchor="middle">${esc(p.sl.short)}</text>`).join("");
  const dots = have.map(p => `<circle class="pt ${p.m.baseline ? "base" : ""}" cx="${x(p.i)}" cy="${y(p.v)}" r="4.5"><title>${esc(p.m.label)}: ${esc(fmt(p.m.values[k.id]))}</title></circle>`).join("");
  const fdots = fpts.map(p => `<circle class="pt fc" cx="${x(p.i)}" cy="${y(p.f)}" r="3.5"><title>${esc(p.sl.label)} target: ${p.f}</title></circle>`).join("");
  const lab = `<text class="val" x="${x(last.i)}" y="${y(last.v) - 9}" text-anchor="middle">${esc(fmt(last.m.values[k.id]))}</text>`;
  const flab = fpts.length ? `<text class="val fc" x="${x(fpts[fpts.length - 1].i)}" y="${y(fpts[fpts.length - 1].f) - 9}" text-anchor="end">${fpts[fpts.length - 1].f}</text>` : "";
  return `<div class="chart"><div class="l">${esc(k.label)}</div><div class="n">${esc(k.unit || k.note)}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(k.label)} by month">${grid}${fpath ? `<path class="ln fc" d="${fpath}"/>` : ""}<path class="ln" d="${path}"/>${fdots}${dots}${lab}${flab}${labels}</svg></div>`;
}
function groupTiles(k, m, prev) { return k.map(x => tile(x, m, prev)).join(""); }
const groups = ["SEO", "GEO", "Content", "Search Console"];

const dkey = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 80);
let DS = { items: {}, ok: false };
function discussCards(list) {
  const rows = list.map(x => ({ ...x, k: dkey(x.topic), s: DS.items[dkey(x.topic)] || (x.done ? { done: true, note: x.note || "", by: x.by || "", at: x.at || "" } : null) }));
  const open = rows.filter(r => !r.s?.done), done = rows.filter(r => r.s?.done);

  return open.map(card).join("") + (done.length ? `</div><h3 class="g">Decided, archive</h3><div class="cards">${done.map(card).join("")}` : "");
}
function myName() { try { return localStorage.getItem("mtr-name") || ""; } catch { return ""; } }

document.addEventListener("submit", async e => {

});

function month(m) {

    h += `<section><h2>AI answers, tracked prompts</h2><p class="sub">Source: ${esc(m.aiPrompts.source)}</p><div class="tablewrap"><table><thead><tr><th>Lang</th><th>Prompt</th><th>ChatGPT</th><th>Gemini</th><th>Perplexity</th><th>Named first</th><th>Also named</th></tr></thead><tbody>${m.aiPrompts.rows.map(r => `<tr><td>${esc(r.lang.toUpperCase())}</td><td>${tr(r.prompt, r.lang)}</td><td>${cell(r.chatgpt)}</td><td>${cell(r.gemini)}</td><td>${cell(r.perplexity)}</td><td>${esc(r.first_named ?? "")}</td><td>${esc(r.rivals || "")}</td></tr>`).join("")}</tbody></table></div><p class="caveat">"Also named" lists the other Swiss suppliers the three engines mention for that prompt (×2 = named by two engines); that is the competition for the answer. Nobody publishes how many people ask these questions, so there is no prompt volume. "Named" = Meditron appears in the answer. "Cited" = meditron.ch is one of the answer's sources. Answers come from the engines' APIs with web search on, from a neutral location, so they are a trend line rather than what one Swiss user sees.</p></section>`; }

async function unlock(pw) {

<div id="tip" aria-hidden="true"></div>
<script>
(() => {
  const tip = document.getElementById("tip");
  if (!matchMedia("(hover: hover)").matches) return;
  document.addEventListener("mouseover", e => {
    const el = e.target.closest(".tr"); if (!el) return;
    tip.textContent = el.dataset.en; tip.classList.add("on");
    const r = el.getBoundingClientRect(); tip.style.left = "0px"; tip.style.top = "0px";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = el.classList.contains("eye") ? r.right - w : r.left, y = r.top - h - 6;
    if (x < 8) x = 8;
    if (x + w > innerWidth - 8) x = innerWidth - 8 - w;
    if (y < 8) y = r.bottom + 6;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  document.addEventListener("mouseout", e => { if (e.target.closest(".tr")) tip.classList.remove("on"); });
  addEventListener("scroll", () => tip.classList.remove("on"), { passive: true });
})();
